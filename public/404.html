<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>PROXY // 404_ERROR</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #07000e;
      min-height: 100vh;
      font-family: 'Space Mono', monospace;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow: hidden;
      position: relative;
    }
    .bg-bubbles {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 32, 96, 0.28) 0%, rgba(150, 0, 255, 0.12) 60%, transparent 100%);
      filter: blur(10px);
      animation: float 13s infinite ease-in-out;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-32px) scale(1.12); }
    }
    .error-card {
      position: relative;
      z-index: 2;
      background: rgba(18, 4, 32, 0.55);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(150, 0, 255, 0.28);
      border-radius: 6px;
      padding: 2.4rem 2rem;
      text-align: center;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.85), 0 0 24px rgba(150, 0, 255, 0.12);
      max-width: 500px;
      width: 100%;
    }
    .error-code {
      font-size: 3.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ff2060, #cc00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.25rem;
      letter-spacing: 0.04em;
      line-height: 1;
    }
    .error-msg {
      font-size: 0.68rem;
      color: rgba(180, 0, 255, 0.65);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 1.4rem;
    }
    .checklist {
      text-align: left;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(150, 0, 255, 0.18);
      border-radius: 5px;
      padding: 1.1rem 1.15rem;
      margin-bottom: 1.4rem;
      font-size: 0.74rem;
      color: rgba(255, 255, 255, 0.72);
      line-height: 1.9;
    }
    .checklist ul { list-style: none; }
    .checklist li {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      margin-bottom: 0.15rem;
    }
    .checklist li:last-child { margin-bottom: 0; }
    .dot {
      width: 6px;
      height: 6px;
      min-width: 6px;
      background-color: #ff2060;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 7px #ff2060;
      animation: pulse 1.8s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .reload-btn {
      display: inline-block;
      padding: 0.65rem 1.4rem;
      background: rgba(120, 0, 220, 0.2);
      border: 1px solid rgba(150, 0, 255, 0.4);
      color: rgba(220, 150, 255, 0.95);
      font-family: 'Space Mono', monospace;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.22s ease;
      margin-bottom: 1.5rem;
    }
    .reload-btn:hover {
      background: rgba(160, 0, 255, 0.4);
      color: #fff;
      border-color: rgba(200, 0, 255, 0.75);
      box-shadow: 0 0 18px rgba(160, 0, 255, 0.4);
    }
    .signature {
      font-size: 0.62rem;
      color: #ff2060;
      opacity: 0.8;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border-top: 1px solid rgba(150, 0, 255, 0.2);
      padding-top: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="bg-bubbles">
    <div class="bubble" style="width:170px;height:170px;top:11%;left:14%;animation-delay:0s"></div>
    <div class="bubble" style="width:220px;height:220px;bottom:11%;right:9%;animation-delay:-4s"></div>
    <div class="bubble" style="width:110px;height:110px;top:55%;left:7%;animation-delay:-2s"></div>
  </div>
  <div class="error-card">
    <div class="error-code">404</div>
    <div class="error-msg">// connection_intercepted</div>
    <div class="checklist">
      <ul>
        <li><span class="dot"></span> Checking your internet connection</li>
        <li><span class="dot" style="animation-delay: 0.3s"></span> Verifying you entered the correct address</li>
        <li><span class="dot" style="animation-delay: 0.6s"></span> Clearing the site data & worker cache</li>
        <li><span class="dot" style="animation-delay: 0.9s"></span> Contacting system administrator</li>
        <li><span class="dot" style="animation-delay: 1.2s"></span> Verifying the destination isn't blocked</li>
      </ul>
    </div>
    <button onclick="location.reload()" class="reload-btn">[ retry connection ]</button>
    <div class="signature">Monitored by Nitro / A.S</div>
  </div>
</body>
</html>
