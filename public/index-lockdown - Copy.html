
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
  <title>404 // Access Restricted</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }

    body {
      background: #080203;
      min-height: 100vh;
      font-family: 'Space Mono', monospace;
      color: #fff;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
      padding: 1.5rem;
    }

    .blob, .orb, .particle {
      position: fixed;
      pointer-events: none;
      z-index: 1;
    }

    .blob {
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.7;
    }

    .b1 {
      width: 720px;
      height: 720px;
      background: radial-gradient(circle, rgba(220,0,50,0.32), transparent 70%);
      top: -250px;
      left: -220px;
      animation: floatBlob1 12s ease-in-out infinite alternate;
    }

    .b2 {
      width: 560px;
      height: 560px;
      background: radial-gradient(circle, rgba(255,30,80,0.26), transparent 70%);
      bottom: -170px;
      right: -140px;
      animation: floatBlob2 10s ease-in-out infinite alternate;
    }

    .orb {
      border-radius: 50%;
      filter: blur(22px);
      mix-blend-mode: screen;
      opacity: 0.55;
    }

    .o1 {
      width: 180px;
      height: 180px;
      top: 24%;
      left: 27%;
      background: radial-gradient(circle, rgba(255,50,90,0.38), transparent 68%);
      animation: drift1 11s ease-in-out infinite alternate;
    }

    .o2 {
      width: 150px;
      height: 150px;
      top: 34%;
      right: 28%;
      background: radial-gradient(circle, rgba(255,0,120,0.28), transparent 68%);
      animation: drift2 13s ease-in-out infinite alternate;
    }

    .o3 {
      width: 120px;
      height: 120px;
      top: 58%;
      left: 42%;
      background: radial-gradient(circle, rgba(255,120,160,0.24), transparent 70%);
      animation: drift3 9s ease-in-out infinite alternate;
    }

    .particle {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255,120,150,0.75);
      box-shadow: 0 0 10px rgba(255,80,100,0.7);
      opacity: 0.85;
    }

    .p1 { top: 42%; left: 46%; animation: particleUp 6s ease-in-out infinite; }
    .p2 { top: 50%; left: 54%; animation: particleUp 7s ease-in-out infinite 0.8s; }
    .p3 { top: 60%; left: 49%; animation: particleUp 8s ease-in-out infinite 1.5s; }
    .p4 { top: 30%; left: 50%; animation: particleUp 9s ease-in-out infinite 0.4s; }

    @keyframes floatBlob1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.08); }
    }

    @keyframes floatBlob2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-50px, -30px) scale(1.06); }
    }

    @keyframes drift1 {
      0% { transform: translate(-20px, 10px) scale(1); opacity: 0.45; }
      50% { transform: translate(35px, -18px) scale(1.12); opacity: 0.7; }
      100% { transform: translate(18px, 22px) scale(0.98); opacity: 0.5; }
    }

    @keyframes drift2 {
      0% { transform: translate(18px, -8px) scale(1); opacity: 0.4; }
      50% { transform: translate(-28px, 22px) scale(1.15); opacity: 0.68; }
      100% { transform: translate(-10px, -16px) scale(1.02); opacity: 0.46; }
    }

    @keyframes drift3 {
      0% { transform: translate(-10px, 16px) scale(1); opacity: 0.35; }
      50% { transform: translate(24px, -20px) scale(1.18); opacity: 0.62; }
      100% { transform: translate(10px, 8px) scale(0.96); opacity: 0.42; }
    }

    @keyframes particleUp {
      0%   { transform: translateY(14px) scale(0.8); opacity: 0; }
      15%  { opacity: 0.95; }
      50%  { transform: translateY(-30px) scale(1); opacity: 0.75; }
      100% { transform: translateY(-90px) scale(0.7); opacity: 0; }
    }

    .tech-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 0, 40, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 0, 40, 0.06) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 2;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.14) 2px,
        rgba(0,0,0,0.14) 4px
      );
      pointer-events: none;
      z-index: 3;
      animation: moveScanlines 8s linear infinite;
    }

    @keyframes moveScanlines {
      0% { background-position: 0 0; }
      100% { background-position: 0 100px; }
    }

    .error-card {
      position: relative;
      z-index: 10;
      width: min(92vw, 520px);
      padding: clamp(2rem, 5vw, 3rem) clamp(1.4rem, 5vw, 4rem);
      text-align: center;
      background: rgba(40, 0, 10, 0.28);
      border: 1px solid rgba(255, 30, 60, 0.28);
      border-radius: 6px;
      backdrop-filter: blur(36px) saturate(1.35);
      -webkit-backdrop-filter: blur(36px) saturate(1.35);
      box-shadow:
        0 0 50px rgba(0, 0, 0, 0.88),
        0 0 30px rgba(255, 0, 50, 0.12);
      animation: cardPulse 4s ease-in-out infinite alternate, cardFadeIn 0.8s ease-out;
    }

    @keyframes cardPulse {
      0% {
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.88), 0 0 25px rgba(255, 0, 50, 0.1);
        border-color: rgba(255, 30, 60, 0.24);
      }
      100% {
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 0, 50, 0.22);
        border-color: rgba(255, 30, 60, 0.45);
      }
    }

    @keyframes cardFadeIn {
      0% { opacity: 0; transform: translateY(20px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .error-card::before,
    .error-card::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: rgba(255,40,80,0.8);
      border-style: solid;
      pointer-events: none;
    }

    .error-card::before {
      top: -1px;
      left: -1px;
      border-width: 2px 0 0 2px;
    }

    .error-card::after {
      right: -1px;
      bottom: -1px;
      border-width: 0 2px 2px 0;
    }

    .error-code {
      font-size: clamp(2.8rem, 10vw, 3.5rem);
      font-weight: 700;
      background: linear-gradient(135deg, #ff1e3c, #ff6b81);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      line-height: 1;
    }

    .error-msg {
      font-size: 0.75rem;
      color: rgba(255, 80, 100, 0.72);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
    }

    .error-desc {
      font-size: 0.84rem;
      color: rgba(255, 255, 255, 0.72);
      line-height: 1.65;
      margin-bottom: 1.75rem;
    }

    .signature {
      font-size: 0.65rem;
      color: rgba(255, 90, 110, 0.82);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border-top: 1px solid rgba(255, 30, 60, 0.2);
      padding-top: 1rem;
      margin-top: 0.25rem;
    }

    .back-btn {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.6rem 1.15rem;
      background: rgba(180, 0, 30, 0.2);
      border: 1px solid rgba(255, 30, 60, 0.4);
      color: rgba(255, 130, 145, 0.95);
      text-decoration: none;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .back-btn:hover {
      background: rgba(255, 30, 60, 0.35);
      color: #fff;
      box-shadow: 0 0 15px rgba(255, 30, 60, 0.4);
      transform: translateY(-1px);
    }

    .back-btn:focus-visible {
      outline: 2px solid rgba(255, 130, 145, 0.9);
      outline-offset: 2px;
    }

    @media (max-width: 480px) {
      .error-card {
        padding: 1.7rem 1.1rem;
      }

      .error-msg {
        letter-spacing: 0.14em;
        font-size: 0.7rem;
      }

      .error-desc {
        font-size: 0.8rem;
      }

      .o1, .o2, .o3 {
        opacity: 0.35;
        filter: blur(18px);
      }
    }
  </style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>

  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>

  <div class="particle p1"></div>
  <div class="particle p2"></div>
  <div class="particle p3"></div>
  <div class="particle p4"></div>

  <div class="tech-grid"></div>
  <div class="scanlines"></div>

  <div class="error-card">
    <div class="error-code">404</div>
    <div class="error-msg">// lockdown_active</div>
    <p class="error-desc">Unauthorized probe detected or destination unreachable. Traffic logged.</p>
    <a class="back-btn" href="#" role="button" id="enterKeyBtn">[ enter key ]</a>
    <div class="signature">Managed &amp; Monitored by Nitro AS</div>
  </div>

  <script>
    document.getElementById('enterKeyBtn').addEventListener('click', function (e) {
      e.preventDefault();
      const userPass = prompt('Bypass Lockdown: Enter the access key to proceed.');
      if (userPass) {
        window.location.href = '/?pass=' + encodeURIComponent(userPass);
      }
    });
  </script>
</body>
</html>
